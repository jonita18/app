<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Llamada con Gemini</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f5f9;
    --surface: #ffffff;
    --text: #1a2130;
    --muted: #5c6678;
    --line: #d7dde8;
    --field: #f8f9fc;
    --call: #1f9d55;
    --hang: #e0463f;
    --accent: #3a6fd6;
    --error-bg: #fdeceb;
    --error-text: #a3251f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --surface: #161b24;
      --text: #e7ebf2;
      --muted: #8e99ac;
      --line: #2a3242;
      --field: #0a0e14;
      --call: #22c55e;
      --hang: #ef4444;
      --accent: #7aa7ff;
      --error-bg: #3b1518;
      --error-text: #ffb3b0;
    }
  }

  [hidden] { display: none !important; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .top { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
  .brand { color: var(--muted); font-size: 0.95rem; font-weight: 600; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    font-size: 1.2rem;
  }

  .stage {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 6px;
  }
  .avatar {
    width: 148px; height: 148px; border-radius: 50%; margin-bottom: 14px;
    display: grid; place-items: center; color: #fff; font-size: 3.2rem;
    background: radial-gradient(circle at 30% 25%, #8fb4ff, #3a6fd6 60%, #5b4bc4);
  }
  body[data-state="connecting"] .avatar { animation: ring 1.4s ease-out infinite; }
  body[data-state="live"] .avatar { animation: ring 2.4s ease-out infinite; }
  @keyframes ring {
    0% { box-shadow: 0 0 0 0 rgba(58, 111, 214, 0.55); }
    100% { box-shadow: 0 0 0 28px rgba(58, 111, 214, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    body[data-state] .avatar { animation: none; }
  }
  .name { margin: 0; font-size: 1.6rem; font-weight: 700; }
  .status { margin: 0; color: var(--muted); font-size: 1.05rem; min-height: 1.4em; }
  .timer { margin: 0; font-size: 1.4rem; font-variant-numeric: tabular-nums; min-height: 1.6em; }
  .error {
    margin: 14px auto 0; max-width: 480px; padding: 12px 14px; border-radius: 12px;
    background: var(--error-bg); color: var(--error-text); font-size: 0.95rem; text-align: left;
  }
  .tip { margin: 12px 0 0; max-width: 34ch; color: var(--muted); font-size: 0.85rem; }

  .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 56px; padding-top: 12px; }
  .btn { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; }
  .round {
    width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center; color: #fff; font-size: 2rem;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  .round:active { transform: scale(0.95); }
  .round:disabled { opacity: 0.35; cursor: default; }
  .call { background: var(--call); }
  .hang { background: var(--hang); }
  .hang .ico { display: inline-block; transform: rotate(135deg); }

  .sheet {
    position: fixed; inset: 0; overflow-y: auto; background: var(--bg);
    padding: 20px 16px 32px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  }
  .sheet h2 { margin: 0 0 12px; font-size: 1.3rem; text-align: center; }
  .sheet form { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
  label { display: grid; gap: 6px; font-size: 0.95rem; font-weight: 600; }
  input, select, textarea {
    width: 100%; padding: 12px; font: inherit; font-size: 1rem; font-weight: 400; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 10px;
  }
  textarea { min-height: 220px; resize: vertical; line-height: 1.45; }
  .hint { margin: -10px 0 0; color: var(--muted); font-size: 0.85rem; font-weight: 400; }
  .row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
  .pill { border: 0; border-radius: 999px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  .pill.primary { background: var(--accent); color: #fff; }
  .pill.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
</style>
</head>
<body>
  <header class="top">
    <span class="brand">Llamada con Gemini</span>
    <button id="btnSettings" class="icon-btn" type="button" aria-label="Configuración" title="Configuración">⚙</button>
  </header>

  <main class="stage">
    <div class="avatar" aria-hidden="true">✦</div>
    <h1 class="name">Gemini</h1>
    <p id="status" class="status" role="status" aria-live="polite">Listo para llamar</p>
    <p id="timer" class="timer">00:00</p>
    <p id="error" class="error" role="alert" hidden></p>
    <p class="tip">Consejo: usá auriculares para que la voz de la tablet no vuelva al micrófono.</p>
  </main>

  <footer class="actions">
    <div class="btn">
      <button id="btnCall" class="round call" type="button" aria-label="Llamar"><span aria-hidden="true">📞</span></button>
      <span>Llamar</span>
    </div>
    <div class="btn">
      <button id="btnHang" class="round hang" type="button" aria-label="Colgar" disabled><span class="ico" aria-hidden="true">📞</span></button>
      <span>Colgar</span>
    </div>
  </footer>

  <section id="settings" class="sheet" aria-labelledby="settingsTitle" hidden>
    <form id="settingsForm">
      <h2 id="settingsTitle">Configuración</h2>
      <label>Clave de API de Google AI Studio
        <input id="cfgKey" type="password" autocomplete="off" spellcheck="false">
      </label>
      <p class="hint">Se guarda solo en este navegador. No la compartas.</p>
      <label>Modelo
        <input id="cfgModel" type="text" autocomplete="off" spellcheck="false">
      </label>
      <label>Voz
        <select id="cfgVoice">
          <option value="Kore">Kore</option>
          <option value="Puck">Puck</option>
          <option value="Charon">Charon</option>
          <option value="Fenrir">Fenrir</option>
          <option value="Aoede">Aoede</option>
        </select>
      </label>
      <label>Prompt (las instrucciones para Gemini)
        <textarea id="cfgPrompt" placeholder="Pegá acá el prompt que ya tenés en Gemini"></textarea>
      </label>
      <div class="row">
        <button id="btnCancelCfg" class="pill secondary" type="button">Cancelar</button>
        <button class="pill primary" type="submit">Guardar</button>
      </div>
    </form>
  </section>

  <script>
  (() => {
    'use strict';

    // ---------- Ajustes ----------
    // El mensaje de configuración sigue la referencia de la API Live (generationConfig).
    const STORE_KEY = 'llamada-gemini-v1';
    const WS_URL = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent';
    const DEFAULT_MODEL = 'gemini-3.8-live'; // modelo de voz en vivo que usa la guía oficial de Google
    const DEFAULT_VOICE = 'Kore';
    const DEFAULT_PROMPT = 'Sos un asistente de voz amable. Respondé en español, de forma breve y natural.';
    const MIC_RATE = 16000;          // Gemini recibe el micrófono como PCM de 16 kHz
    const DEFAULT_OUT_RATE = 24000;  // y devuelve la voz como PCM de 24 kHz
    const SETUP_TIMEOUT_MS = 15000;

    // ---------- Configuración guardada en este navegador ----------
    const DEFAULTS = { apiKey: '', model: DEFAULT_MODEL, voice: DEFAULT_VOICE, prompt: '' };

    function loadConfig() {
      try {
        return { ...DEFAULTS, ...JSON.parse(localStorage.getItem(STORE_KEY) || '{}') };
      } catch (_) {
        return { ...DEFAULTS };
      }
    }

    let cfg = loadConfig();

    function saveConfig(next) {
      cfg = next;
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(cfg));
      } catch (_) {
        // Sin almacenamiento, la configuración queda solo mientras la página esté abierta.
      }
    }

    // ---------- Elementos de la pantalla ----------
    const $ = (id) => document.getElementById(id);
    const ui = {
      status: $('status'), timer: $('timer'), error: $('error'),
      call: $('btnCall'), hang: $('btnHang'), gear: $('btnSettings'),
      sheet: $('settings'), form: $('settingsForm'), cancel: $('btnCancelCfg'),
      key: $('cfgKey'), model: $('cfgModel'), voice: $('cfgVoice'), prompt: $('cfgPrompt')
    };
    const pad = (n) => String(n).padStart(2, '0');

    function setUi(state, text) {
      document.body.dataset.state = state; // idle | connecting | live
      ui.status.textContent = text;
      const busy = state === 'connecting' || state === 'live';
      ui.call.disabled = busy;
      ui.hang.disabled = !busy;
    }

    function showError(message) {
      ui.error.textContent = message || '';
      ui.error.hidden = !message;
    }

    function openSettings() {
      ui.key.value = cfg.apiKey;
      ui.model.value = cfg.model || DEFAULT_MODEL;
      ui.voice.value = cfg.voice || DEFAULT_VOICE;
      ui.prompt.value = cfg.prompt;
      ui.sheet.hidden = false;
    }

    ui.gear.addEventListener('click', openSettings);
    ui.cancel.addEventListener('click', () => { ui.sheet.hidden = true; });
    ui.form.addEventListener('submit', (e) => {
      e.preventDefault();
      saveConfig({
        apiKey: ui.key.value.trim(),
        model: ui.model.value.trim() || DEFAULT_MODEL,
        voice: ui.voice.value || DEFAULT_VOICE,
        prompt: ui.prompt.value
      });
      ui.sheet.hidden = true;
      showError('');
    });

    // ---------- Llamada ----------
    let call = null; // la llamada en curso, o null si no hay ninguna

    function stopTracks(stream) {
      if (stream) stream.getTracks().forEach((track) => track.stop());
    }

    function startErrorText(err) {
      if (err && err.name === 'NotAllowedError') return 'No diste permiso para usar el micrófono. Permitilo en el navegador y volvé a tocar Llamar.';
      if (err && err.name === 'NotFoundError') return 'No encontré un micrófono en esta tablet.';
      return 'No se pudo iniciar la llamada: ' + (err && err.message ? err.message : err);
    }

    async function startCall() {
      if (call) return;
      showError('');
      if (!cfg.apiKey) {
        showError('Primero pegá tu clave de API en Configuración (⚙).');
        openSettings();
        return;
      }
      if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError('Esta página tiene que abrirse con https (por ejemplo desde GitHub Pages) para usar el micrófono.');
        return;
      }

      const c = {
        ctx: null, stream: null, ws: null, nodes: [],
        ready: false, failed: false, nextTime: 0, playing: new Set(),
        tickId: null, setupTimer: null, startedAt: 0, wake: null
      };
      call = c;
      setUi('connecting', 'Llamando…');
      ui.timer.textContent = '00:00';

      try {
        // El contexto de audio se crea dentro del toque en "Llamar", como exige el navegador.
        c.ctx = new (window.AudioContext || window.webkitAudioContext)();
        await c.ctx.resume();

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        if (call !== c) { stopTracks(stream); return; } // colgaron mientras se pedía el micrófono
        c.stream = stream;

        // Micrófono -> procesador (envía audio a Gemini) -> silencio -> salida (sin sonido)
        const source = c.ctx.createMediaStreamSource(stream);
        const processor = c.ctx.createScriptProcessor(4096, 1, 1);
        const silence = c.ctx.createGain();
        silence.gain.value = 0;
        processor.onaudioprocess = (e) => sendMic(c, e);
        source.connect(processor);
        processor.connect(silence);
        silence.connect(c.ctx.destination);
        c.nodes.push(source, processor, silence);

        const ws = new WebSocket(WS_URL + '?key=' + encodeURIComponent(cfg.apiKey));
        c.ws = ws;
        ws.onopen = () => {
          if (call === c) ws.send(JSON.stringify(buildSetup()));
        };
        ws.onmessage = (ev) => {
          if (call === c) onServerMessage(c, ev.data);
        };
        ws.onclose = (ev) => {
          if (call !== c) return;
          const seCorto = ev.code !== 1000 && !c.failed;
          const motivo = ev.reason ? ': ' + ev.reason : '';
          teardown(c);
          setUi('idle', 'Llamada terminada');
          if (seCorto) {
            showError('Se cortó la llamada (código ' + ev.code + ')' + motivo + '. Revisá la clave, el modelo y la voz en Configuración.');
          }
        };

        c.setupTimer = setTimeout(() => {
          if (call === c && !c.ready) fail(c, 'Gemini no respondió. Revisá la clave y el modelo en Configuración.');
        }, SETUP_TIMEOUT_MS);
      } catch (err) {
        if (call === c) fail(c, startErrorText(err));
      }
    }

    function hangUp() {
      const c = call;
      if (!c) return;
      teardown(c);
      setUi('idle', 'Llamada terminada');
    }

    function fail(c, message) {
      c.failed = true;
      teardown(c);
      setUi('idle', 'No se pudo llamar');
      showError(message);
    }

    function teardown(c) {
      clearTimeout(c.setupTimer);
      clearInterval(c.tickId);
      stopPlayback(c);
      c.nodes.forEach((node) => {
        if ('onaudioprocess' in node) node.onaudioprocess = null;
        try { node.disconnect(); } catch (_) {}
      });
      c.nodes = [];
      stopTracks(c.stream);
      c.stream = null;
      if (c.ws) {
        const ws = c.ws;
        ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null;
        try { ws.close(1000); } catch (_) {}
        c.ws = null;
      }
      if (c.ctx) {
        c.ctx.close().catch(() => {});
        c.ctx = null;
      }
      if (c.wake) {
        c.wake.release().catch(() => {});
        c.wake = null;
      }
      if (call === c) call = null;
    }

    function goLive(c) {
      clearTimeout(c.setupTimer);
      c.ready = true;
      c.startedAt = Date.now();
      setUi('live', 'En llamada');
      tick(c);
      c.tickId = setInterval(() => tick(c), 1000);
      keepScreenOn(c);
    }

    function tick(c) {
      const s = Math.floor((Date.now() - c.startedAt) / 1000);
      ui.timer.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60);
    }

    async function keepScreenOn(c) {
      try {
        const lock = await navigator.wakeLock?.request('screen');
        if (!lock) return;
        if (call === c) c.wake = lock;
        else lock.release().catch(() => {});
      } catch (_) {
        // Si el navegador no permite mantener la pantalla encendida, no pasa nada.
      }
    }

    // ---------- Mensajes con Gemini ----------
    function buildSetup() {
      const model = (cfg.model || DEFAULT_MODEL).trim();
      return {
        setup: {
          model: model.startsWith('models/') ? model : 'models/' + model,
          generationConfig: {
            responseModalities: ['AUDIO'],
            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: cfg.voice || DEFAULT_VOICE } } }
          },
          systemInstruction: { parts: [{ text: (cfg.prompt || '').trim() || DEFAULT_PROMPT }] }
        }
      };
    }

    function sendMic(c, e) {
      const ws = c.ws;
      if (call !== c || !c.ready || !ws || ws.readyState !== WebSocket.OPEN) return;
      const pcm = toPcm16(e.inputBuffer.getChannelData(0), c.ctx.sampleRate);
      ws.send(JSON.stringify({
        realtimeInput: { audio: { mimeType: 'audio/pcm;rate=16000', data: toBase64(pcm) } }
      }));
    }

    async function onServerMessage(c, data) {
      let text = data;
      if (data instanceof Blob) text = await data.text();
      else if (data instanceof ArrayBuffer) text = new TextDecoder().decode(data);
      if (call !== c) return;

      let msg;
      try { msg = JSON.parse(text); } catch (_) { return; }

      if (msg.error) {
        fail(c, msg.error.message || 'Gemini devolvió un error.');
        return;
      }
      if (!c.ready) goLive(c); // el primer mensaje después de la configuración abre la llamada
      if (msg.goAway) {
        showError('Google va a cerrar esta sesión por límite de tiempo. Volvé a llamar para seguir.');
        return;
      }

      const sc = msg.serverContent;
      if (!sc) return;
      if (sc.interrupted) stopPlayback(c); // hablaste encima de Gemini: se corta su voz
      const parts = (sc.modelTurn && sc.modelTurn.parts) || [];
      for (const part of parts) {
        const audio = part.inlineData;
        if (audio && audio.data) playPcm(c, audio.data, rateFromMime(audio.mimeType));
      }
    }

    // ---------- Audio ----------
    function rateFromMime(mime) {
      const m = /rate=(\d+)/.exec(mime || '');
      return m ? Number(m[1]) : DEFAULT_OUT_RATE;
    }

    function playPcm(c, base64, rate) {
      const bytes = fromBase64(base64);
      const n = bytes.byteLength >> 1;
      if (n === 0) return;
      const ints = new Int16Array(bytes.buffer, 0, n);
      const floats = new Float32Array(n);
      for (let i = 0; i < n; i++) floats[i] = ints[i] / 32768;
      const buffer = c.ctx.createBuffer(1, n, rate);
      buffer.copyToChannel(floats, 0);
      const src = c.ctx.createBufferSource();
      src.buffer = buffer;
      src.connect(c.ctx.destination);
      const when = Math.max(c.ctx.currentTime + 0.02, c.nextTime);
      src.start(when);
      c.nextTime = when + buffer.duration;
      c.playing.add(src);
      src.onended = () => c.playing.delete(src);
    }

    function stopPlayback(c) {
      c.playing.forEach((src) => { try { src.stop(); } catch (_) {} });
      c.playing.clear();
      c.nextTime = 0;
    }

    // Convierte el audio del micrófono (Float32, por ejemplo a 48 kHz) a PCM de 16 bits y 16 kHz.
    function toPcm16(input, inRate) {
      const ratio = inRate / MIC_RATE;
      const len = Math.floor(input.length / ratio);
      const out = new Int16Array(len);
      for (let i = 0; i < len; i++) {
        const from = Math.floor(i * ratio);
        const to = Math.max(from + 1, Math.min(input.length, Math.floor((i + 1) * ratio)));
        let sum = 0;
        for (let j = from; j < to; j++) sum += input[j];
        const v = Math.max(-1, Math.min(1, sum / (to - from)));
        out[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
      }
      return out;
    }

    function toBase64(int16) {
      const bytes = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
      let binary = '';
      for (let i = 0; i < bytes.length; i += 0x2000) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x2000));
      }
      return btoa(binary);
    }

    function fromBase64(b64) {
      const binary = atob(b64);
      const out = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
      return out;
    }

    // ---------- Arranque ----------
    ui.call.addEventListener('click', startCall);
    ui.hang.addEventListener('click', hangUp);
    setUi('idle', cfg.apiKey ? 'Listo para llamar' : 'Primero configurá tu clave (⚙)');
    ui.timer.textContent = '00:00';
  })();
  </script>
</body>
</html>
